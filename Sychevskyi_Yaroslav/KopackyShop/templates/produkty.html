{% extends 'base.html' %}
{% block obsah %}
<h1>Všechny kopačky</h1>

<form class="filtry" method="get" action="{{ url_for('produkty') }}">
  <input type="text" name="hledat" placeholder="Hledej název, značku nebo povrch" value="{{ hledat }}">
  <select name="kategorie">
    <option value="0">Všechny povrchy</option>
    {% for k in kategorie_list %}
      <option value="{{ k.id }}" {% if zvolena_kategorie == k.id %}selected{% endif %}>{{ k.nazev }}</option>
    {% endfor %}
  </select>
  <select name="razeni">
    <option value="nazev" {% if razeni == 'nazev' %}selected{% endif %}>Podle názvu</option>
    <option value="nejlevnejsi" {% if razeni == 'nejlevnejsi' %}selected{% endif %}>Nejlevnější</option>
    <option value="nejdrazsi" {% if razeni == 'nejdrazsi' %}selected{% endif %}>Nejdražší</option>
  </select>
  <button type="submit">Hledat</button>
  <a class="tlacitko" href="{{ url_for('produkty') }}">Zrušit filtr</a>
</form>

<div class="mrizka">
  {% for p in produkty %}
    <article class="karta">
      <div class="ilustrace">👟</div>
      <small>{{ p.znacka }} · {{ p.kategorie }}</small>
      <h3>{{ p.nazev }}</h3>
      <strong>{{ p.cena }} Kč</strong>
      <a class="tlacitko" href="{{ url_for('detail', pid=p.id) }}">Zobrazit</a>
    </article>
  {% else %}
    <p>Žádné kopačky jsme nenašli. Zkus jiné slovo.</p>
  {% endfor %}
</div>
{% endblock %}
