{% extends 'base.html' %}
{% block obsah %}
<h1>Katalog kopaček</h1>

<form class="filtry" method="get">
    <input name="hledat" value="{{ hledat }}" placeholder="Hledat kopačky">
    <select name="kategorie">
        <option value="0">Všechny povrchy</option>
        {% for k in kategorie_list %}
        <option value="{{ k.id }}" {% if zvolena_kategorie == k.id %}selected{% endif %}>{{ k.nazev }}</option>
        {% endfor %}
    </select>
    <select name="razeni">
        <option value="nazev" {% if razeni=='nazev' %}selected{% endif %}>Podle názvu</option>
        <option value="nejlevnejsi" {% if razeni=='nejlevnejsi' %}selected{% endif %}>Nejlevnější</option>
        <option value="nejdrazsi" {% if razeni=='nejdrazsi' %}selected{% endif %}>Nejdražší</option>
    </select>
    <button type="submit">Filtrovat</button>
    <a href="{{ url_for('produkty') }}">Zrušit filtry</a>
</form>

<p>Nalezeno: {{ produkty|length }}</p>
<div class="mrizka">
    {% for p in produkty %}
    <div class="karta">
        <a href="{{ url_for('detail', pid=p.id) }}"><img src="{{ obrazek_produktu(p) }}" alt="{{ p.znacka }} {{ p.nazev }}"></a>
        <p>{{ p.znacka }} - {{ p.kategorie }}</p>
        <h3>{{ p.nazev }}</h3>
        <div class="produkt-dole">
            <strong>{{ p.cena }} Kč</strong>
            <a href="{{ url_for('detail', pid=p.id) }}">Detail</a>
        </div>
    </div>
    {% else %}
    <p>Nic jsme nenašli.</p>
    {% endfor %}
</div>
{% endblock %}
