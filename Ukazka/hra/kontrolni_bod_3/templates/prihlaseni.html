{% extends "base.html" %}
{% block titulek %}Přihlášení{% endblock %}
{% block obsah %}
<h1>Přihlášení</h1>
<form class="formular" method="post">
    <label>Jméno
        <input type="text" name="jmeno" required autofocus>
    </label>
    <label>Heslo
        <input type="password" name="heslo" required>
    </label>
    <button type="submit">Přihlásit</button>
</form>
<p>Nemáš účet? <a href="{{ url_for('registrace') }}">Zaregistruj se.</a></p>
{% endblock %}
